name: build-ios

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Entitlements/**', 'project.yml', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar solo con aprobación del usuario
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen

      - name: Simulator build + pruebas + capturas
        run: |
          set -e
          xcodebuild \
            -project MenuSemanal.xcodeproj \
            -scheme MenuSemanal \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone"))] | sort_by(.name) | .[-1].udid')
          echo "Simulador: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "MenuSemanal.app")
          # Firma ad-hoc para embeber los entitlements: sin la sección __entitlements
          # el App Group no existe y el widget no puede leer los datos de la app.
          codesign --force --sign "-" --entitlements Entitlements/Widget.entitlements "$APP/PlugIns/MenuWidget.appex"
          codesign --force --sign "-" --entitlements Entitlements/App.entitlements "$APP"
          for X in "$APP" "$APP/PlugIns/MenuWidget.appex"; do
            if ! codesign -d --entitlements :- "$X" 2>/dev/null | grep -q application-groups; then
              echo "FALTAN entitlements de App Group en $X"
              exit 1
            fi
          done
          xcrun simctl install "$DEVICE" "$APP"
          BID=com.pradaxa.menusemanal
          echo "== Selftest =="
          xcrun simctl launch --console-pty "$DEVICE" "$BID" -selftest 2>&1 | tee selftest.log | grep SELFTEST || true
          sleep 2
          if grep -q "SELFTEST-FAIL" selftest.log || ! grep -q "SELFTEST-PASS all" selftest.log; then
            echo "Hay pruebas fallidas o el selftest no terminó"
            exit 1
          fi
          mkdir -p shots
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance $MODE
            for SCREEN in menu menu-scroll platos platos-busqueda compra ajustes plato-editor widget-medium widget-large widget-small; do
              xcrun simctl terminate "$DEVICE" "$BID" 2>/dev/null || true
              xcrun simctl launch "$DEVICE" "$BID" -screenshot $SCREEN >/dev/null 2>&1 || true
              sleep 5
              xcrun simctl io "$DEVICE" screenshot "shots/${MODE}-${SCREEN}.png" || true
            done
          done
          ls -la shots/

      - name: Subir capturas
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Build IPA (unsigned)
        run: |
          xcodebuild \
            -project MenuSemanal.xcodeproj \
            -scheme MenuSemanal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="0.3.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/MenuSemanal.app" Payload/
          APP="Payload/MenuSemanal.app"
          # Firma ad-hoc SOLO para embeber los entitlements en el binario. AltStore
          # vuelve a firmar al instalar y toma los App Groups de esta sección; sin
          # ella el widget no comparte datos con la app.
          codesign --force --sign "-" --entitlements Entitlements/Widget.entitlements "$APP/PlugIns/MenuWidget.appex"
          codesign --force --sign "-" --entitlements Entitlements/App.entitlements "$APP"
          for X in "$APP" "$APP/PlugIns/MenuWidget.appex"; do
            if ! codesign -d --entitlements :- "$X" 2>/dev/null | grep -q application-groups; then
              echo "FALTAN entitlements de App Group en $X"
              exit 1
            fi
          done
          echo "Entitlements de App Group verificados en app y widget"
          zip -r -q MenuSemanal.ipa Payload
          ls -lh MenuSemanal.ipa

      - name: Guardar IPA preparada
        uses: actions/upload-artifact@v4
        with:
          name: menu-ipa-preparada
          path: MenuSemanal.ipa

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.3.${{ github.run_number }}"
          gh release create "$TAG" MenuSemanal.ipa \
            --title "Menú $TAG" \
            --notes "Build automática ${{ github.run_number }}"
          # GitHub a veces deja el asset roto (504 en la URL pública aunque la subida dijo OK).
          # Verificamos la descarga pública y re-subimos si hace falta.
          for i in 1 2 3 4 5; do
            if curl -sfL -o /dev/null "https://github.com/Pradaxa/menu-semanal/releases/download/$TAG/MenuSemanal.ipa"; then
              echo "Asset público descargable OK"
              break
            fi
            echo "Asset no descargable (intento $i), re-subiendo"
            gh release upload "$TAG" MenuSemanal.ipa --clobber
            sleep 10
            if [ "$i" = 5 ]; then
              echo "El asset sigue sin ser descargable tras 5 intentos"
              exit 1
            fi
          done

      - name: Update AltStore source
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          TAG="v0.3.${{ github.run_number }}"
          VER="0.3.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          SIZE=$(stat -f%z MenuSemanal.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NEWAPP=$(jq -n \
            --arg ver "$VER" --arg build "$BUILD" --arg date "$DATE" --argjson size "$SIZE" \
            --arg url "https://github.com/Pradaxa/menu-semanal/releases/download/$TAG/MenuSemanal.ipa" \
            '{
              name: "Menú",
              bundleIdentifier: "com.pradaxa.menusemanal",
              developerName: "Pradaxa",
              localizedDescription: "Tu menú semanal con widget para la pantalla de inicio.",
              iconURL: "https://raw.githubusercontent.com/Pradaxa/menu-semanal/main/altstore/icon.png",
              tintColor: "34C759",
              versions: [{
                version: $ver,
                buildVersion: $build,
                date: $date,
                downloadURL: $url,
                size: $size,
                minOSVersion: "17.0"
              }]
            }')
          # Actualiza la entrada de Menú y conserva otras entradas existentes
          jq --argjson app "$NEWAPP" \
            '.apps = ([.apps[]? | select(.bundleIdentifier != "com.pradaxa.menusemanal")] + [$app])' \
            altstore/source.json > altstore/source.json.tmp && mv altstore/source.json.tmp altstore/source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "AltStore source $TAG [skip ci]" || echo "sin cambios"
          git pull --rebase
          git push
